[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symm-fm-world-v2"
version = "0.2.0"
description = "Predictive three-phase DCE states and guarded stochastic SymmFlow rollouts"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "numpy>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
monai = ["monai==1.5.1"]
imaging = ["SimpleITK>=2.3", "nibabel>=5.2"]
test = ["pytest>=8"]
pcr = ["pandas>=2", "scikit-learn>=1.4", "SimpleITK>=2.3", "nibabel>=5.2", "transformers==4.53.2", "huggingface_hub", "timm", "einops", "openpyxl>=3.1", "tqdm", "scipy", "matplotlib", "omegaconf>=2.3"]

[project.scripts]
symm-world = "symm_world.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
